<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0x4d454e53 // TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --green: #00ff41;
    --green-dim: #00cc33;
    --green-mid: #009922;
    --green-faint: #003311;
    --green-bg: #001100;
    --bg: #000800;
    --text-main: #00ee38;
    --text-dim: #006622;
    --text-faint: #003311;
    --amber: #ffaa00;
    --cyan: #00ffcc;
    --red: #ff3333;
    --border: #002200;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    min-height: 100vh;
  }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,30,0,0.08) 2px, rgba(0,30,0,0.08) 3px);
    pointer-events: none;
    z-index: 9999;
    animation: scanlines 12s linear infinite;
  }

  @keyframes scanlines {
    0%{background-position:0 0}
    100%{background-position:0 100px}
  }

  .crt-vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  .terminal-window {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    z-index: 10;
  }

  .titlebar {
    background: var(--green-faint);
    border-bottom: 1px solid var(--green-mid);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .titlebar-title {
    color: var(--green-dim);
    font-family: 'VT323', monospace;
    font-size: 20px;
    letter-spacing: 3px;
  }

  .titlebar-status {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--green);
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .output-area {
    flex: 1;
    padding: 20px 20px 0;
    overflow-y: auto;
    min-height: 400px;
  }

  .line {
    margin-bottom: 2px;
    line-height: 1.6;
    word-break: break-all;
  }

  .line.prompt-line {
    display: flex;
    gap: 8px;
    color: var(--green);
  }

  .line.prompt-line .prompt-symbol {
    color: var(--green-dim);
    flex-shrink: 0;
  }

  .line.prompt-line .user-cmd {
    color: var(--text-main);
  }

  .line.output { color: var(--text-dim); letter-spacing: 0.5px; }
  .line.system { color: var(--green-dim); }
  .line.warn { color: var(--amber); }
  .line.danger { color: var(--red); }
  .line.anomaly { color: var(--cyan); letter-spacing: 0; }
  .line.empty { min-height: 13px; }
  .line.error { color: #ee4444; }

  .line.glitch-line {
    position: relative;
    animation: lineglitch 12s infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes lineglitch {
    0%,94%,100%{transform:none; opacity:1}
    95%{transform:translateX(-4px) skewX(-1deg); opacity:0.8; color:#ff0055}
    96%{transform:translateX(4px) skewX(1deg); color:#00ffcc}
    97%{transform:none}
  }

  .input-area {
    padding: 12px 20px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--green-faint);
    flex-shrink: 0;
    background: rgba(0,8,0,0.5);
  }

  .input-prompt {
    color: var(--green-dim);
    flex-shrink: 0;
    font-size: 13px;
    letter-spacing: 1px;
  }

  #cmdInput {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid var(--green-faint);
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    outline: none;
    caret-color: var(--green);
    letter-spacing: 1px;
    padding: 2px 0;
  }

  #cmdInput::placeholder {
    color: var(--text-faint);
  }

  .blink-cursor {
    display: inline-block;
    width: 8px;
    height: 13px;
    background: var(--green);
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }

  .redacted {
    background: var(--green-mid);
    color: transparent;
    user-select: none;
    cursor: not-allowed;
    padding: 0 2px;
  }
  .redacted:hover { background: var(--green); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--green-faint); }

  .typing-anim {
    overflow: hidden;
    white-space: nowrap;
    animation: typing 0.5s steps(40) forwards;
  }

  @keyframes typing { from{width:0} to{width:100%} }

  .zalgo { letter-spacing: 0; }
</style>
</head>

function line(text, cls='output', delay=0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = `line ${cls}`;
      if (cls === 'glitch-line') {
        d.style.setProperty('--delay', Math.random() * 8 + 's');

      d.innerHTML = text;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;

}

let catchallIndex = 0;

async function handleInput(raw) {
  if (inputLocked) return;
  if (!raw.trim()) return;

  inputLocked = true;

  cmdHistory.unshift(raw);
  historyIndex = -1;

  await line(`<span class="prompt-symbol">anomaly@0x4d454e53:~$</span> <span class="user-cmd">${raw}</span>`, 'prompt-line');
  await empty();

  const cmd = raw.trim().toLowerCase();

  if (commands[cmd]) {
    await commands[cmd](raw.split(' ').slice(1).join(' '));
  } else {
    const resp = catchallResponses[catchallIndex % catchallResponses.length];
    catchallIndex++;
    await resp(cmd);
  }

  await empty();
  inputLocked = false;
  inp.focus();
}

inp.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const val = inp.value;
    inp.value = '';
    await handleInput(val);
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex < cmdHistory.length - 1) {
      historyIndex++;
      inp.value = cmdHistory[historyIndex];
    }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      inp.value = cmdHistory[historyIndex];
    } else {
      historyIndex = -1;
      inp.value = '';
    }
  }
});

  document.getElementById('uptime').textContent = `${h}:${m}:${s}`;

}, 1000);
